[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "atten"
version = "1.2"
description = "Portable Tkinter desktop scaffold with a SQLite database beside the executable"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pyinstaller>=6",
    "pytest>=8",
]

[project.scripts]
atten = "atten.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atten = ["db/migrations/*.sql", "assets/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
